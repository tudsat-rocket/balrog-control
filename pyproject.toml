[project]
name = "balrog-control"
version = "0.1.0"
description = "Control software for the engine test stand by TUDSaT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "interval-timer>=1.0.0",
    "matplotlib==3.10.8",
    "pandas==3.0.2",
    "pyqtgraph>=0.14.0",
    "pyside6>=6.10.1",
    "ruff>=0.14.6",
    "serial>=0.0.97",
    "tinkerforge>=2.1.32",
]

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
